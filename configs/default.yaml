# =============================================================================
# Prism - default configuration (shared by every phase)
# -----------------------------------------------------------------------------
# Values are merged in this order (later wins):
#   1. configs/default.yaml               (this file)
#   2. configs/env/<env>.yaml             (--env local|cluster, or PRISM_ENV)
#   3. --config path/to/extra.yaml        (optional, repeatable)
#   4. --set key.subkey=value             (command line, repeatable)
# =============================================================================

dataset: combined         # combined = RPLAN + ResPlan in one gallery (default) | rplan | resplan
                          # Phases 01-04 run once per member dataset; 05 builds each dataset's
                          # split and then the merged one; 06-12 work on the merged gallery.

combined:
  datasets: [rplan, resplan]   # each one is converted separately (phases 01-04), then merged

taxonomy:
  level: auto             # fine | unified | auto (fine for one dataset, unified for combined)
                          # fine = dataset-specific room types (RPLAN MasterRoom/SecondRoom/...)
                          # unified = cross-dataset types (bedroom, bathroom, ...) - see room_types.yaml
mode: preview             # preview | full   (every script also accepts --mode)

paths:
  # All relative paths are resolved against the project root.
  data_root: data                 # raw/ and processed/ live here
  artifacts_root: artifacts       # models, embeddings, indexes
  outputs_root: outputs           # HTML reports, PNG previews, CSV metrics
  hf_home: null                   # Hugging Face cache (null = library default)
  torch_home: null                # torch.hub / torchvision cache (null = default)

preview:
  n: 200                  # number of layouts used in preview mode
  seed: 42                # the preview subset is a fixed random sample

runtime:
  device: auto            # auto | cpu | cuda | mps   (auto: cuda > mps > cpu)
  num_workers: auto       # auto: 0 on Windows/macOS, 4 on Linux
  seed: 42
  prefer_packed: false    # read packed .jsonl.gz/.npy files when they exist

# -----------------------------------------------------------------------------
# Raw dataset locations (relative to paths.data_root)
# -----------------------------------------------------------------------------
rplan:
  pkl: raw/rplan/Interface/static/Data/data_train_converted.pkl
  snapshot_dir: raw/rplan/Interface/static/Data/snapshot_train
  img_dir: raw/rplan/Interface/static/Data/Img
  canvas: 256             # Graph2Plan coordinates live in a 256x256 canvas

resplan:
  # Files from https://github.com/m-agour/ResPlan (unzip ResPlan.zip) or the Kaggle release.
  pkl: raw/resplan/ResPlan.pkl
  split_json: raw/resplan/split.json   # official train/val/test/augmented split (optional)
  include_augmented: false             # the 683 rotated/flipped/scaled copies of 667 originals
  canvas: 256
  fit_ratio: 0.67         # longest side of the partitioned plan (balconies and half exterior walls included) /
                          # canvas. 0.67 matches RPLAN on the real data: median outline side ~172 px and
                          # outline-area ratio ~0.26 (RPLAN 172.5 px, 0.255; preview of 200 + 300 plans)
  wall_px_min: 2          # lower bound for the wall thickness in canvas pixels
  room_partition: true    # turn wall-separated rooms into an RPLAN-style partition (rooms meet on wall centre
                          # lines, balconies attached, no double walls) - see src/prism/datasets/resplan_geometry.py
  partition:
    growth: 0.55          # how far rooms grow into the walls, x wall_depth (interior walls ~0.7, exterior ~1)
    steps: 6              # growth increments (neighbours meet half-way across a wall, error <= one step)
    closing: 0.75         # morphological closing of the outline, x wall_depth (fills notches and slivers)
    regularize: 0.4       # per-room opening/closing, x wall_depth (removes door recesses and wall stubs)
    snap: 1.5             # merge x / y coordinates closer than this, x wall_depth (removes small steps)
    fill_holes: 0.05      # unlabelled pockets inside the plan up to this share of its area go to a neighbour
    simplify: 0.25        # coverage simplification tolerance, x wall_depth (shared edges stay shared)
  outdoor_categories: [garden, parking, pool]   # not rooms of the apartment; skipped unless include_outdoor
  include_outdoor: false
  open_passage_min_px: 6  # an un-walled shared boundary at least this long = "arch" (open passage)
  door_min_px: 4          # a door polygon covering at least this length of the shared wall = "door"
                          # (tuned on the real ResPlan.pkl against its own via_door / adjacency edge types)

# -----------------------------------------------------------------------------
# Phase 03 - adjacency and spatial relations (see docs/relations.md)
# -----------------------------------------------------------------------------
geometry:
  adjacency_source: geometric   # geometric | source | union   (source = edges shipped with the dataset:
                                #  Graph2Plan edge list for RPLAN, plan["graph"] for ResPlan/Kaggle)
                                # ResPlan layouts carry their own wall thickness; it overrides
                                # wall_dilation_px for those plans.
  wall_dilation_px: 3           # each room mask is dilated by this many pixels
  min_contact_px: 5             # minimum shared-wall length to call two rooms adjacent
  containment_threshold: 0.9    # bbox overlap ratio for inside / surrounding
  axis_overlap_threshold: 0.5   # projection overlap ratio for pure left/right/above/below
  entrance_max_dist_px: 12      # max distance between front door and entrance room

front_door:
  add_virtual_node: true        # add a "FrontDoor" node linked to the entrance room
  min_width_px: 2               # sanity check on the door segment length

# -----------------------------------------------------------------------------
# Phase 04 - rendering of semantic images from layout JSON
# -----------------------------------------------------------------------------
render:
  size: 256
  draw_room_outlines: true
  outline_width: 2
  boundary_width: 3
  draw_front_door: true
  front_door_width: 4
  unknown_fill: "#bdbdbd"       # colour of masked (removed) rooms in partial queries
  palette: unified              # unified (same colours for RPLAN and ResPlan, needed for combined) | fine

# -----------------------------------------------------------------------------
# Phase 05 - splits and packing
# -----------------------------------------------------------------------------
splits:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42

# -----------------------------------------------------------------------------
# Phase 06/07 - graph pipeline
# -----------------------------------------------------------------------------
graph:
  connection_features: auto     # auto | true | false. RPLAN has no doors/walls, so every RPLAN edge is
                                # "wall" while ResPlan has door/arch/window: in combined mode these
                                # features would let the model tell the datasets apart instead of
                                # comparing layouts, so auto = off for combined, on otherwise.
  include_door_node: true       # use the virtual FrontDoor node in the GNN input
  model: sage                   # gcn | sage | gat
  hidden_dim: 64
  embed_dim: 128
  num_layers: 3
  heads: 4                      # only for gat
  dropout: 0.1
  use_edge_attr: true
  objective: gae                # gae | contrastive | both
  contrastive:
    temperature: 0.2
    node_drop: 0.2
    edge_drop: 0.1
    feature_noise: 0.02
  epochs: 30
  epochs_preview: 5
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 8                   # early stopping on validation loss
  encoders: [descriptor, gnn]   # what phase 07 indexes

# -----------------------------------------------------------------------------
# Phase 08 - vision pipeline
# -----------------------------------------------------------------------------
vision:
  encoders: [dinov2_base]       # colorhist | resnet18 | resnet50 | dinov2_small | dinov2_base |
                                # dinov2_large | clip_b32 | timm:<name>
  image_source: render          # render | snapshot | img
  weights: pretrained           # pretrained | none
  batch_size: 32
  image_size: 224
  pooling: cls                  # cls | mean  (ViT models)

# -----------------------------------------------------------------------------
# Phase 07-10 - retrieval
# -----------------------------------------------------------------------------
retrieval:
  backend: auto                 # auto (faiss if installed) | faiss | numpy
  metric: cosine                # cosine | l2
  index: flat                   # flat | hnsw (faiss only)
  top_k: 10
  num_queries: 50
  num_queries_preview: 12
  query_split: test             # queries are drawn from this split
  rrf_k: 60
  hybrid: true                  # build RRF fusion of every (graph, vision) pair
  grids: 6                      # number of qualitative PNG grids per pipeline

partial:
  strategy: random              # random | remove_type | remove_bedroom | remove_smallest |
                                # remove_largest | keep_connected
  remove_ratio: 0.3
  remove_type: null
  keep_count: 3                 # for keep_connected
  protect_entrance: false       # never remove the room behind the front door
  candidate_pool: 200
  rerank: true
  weights:                      # compatibility re-ranking weights
    room: 0.30
    adjacency: 0.20
    relation: 0.10
    grid: 0.10
    size: 0.10
    door: 0.10
    vector: 0.10

evaluation:
  relevance_adjacency_tau: 0.6  # relevance = same unified room composition AND adjacency sim >= tau
  ged:
    enabled: false
    max_pairs: 200
    timeout_s: 2.0
